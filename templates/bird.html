<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>{{ bird.name }} facts · NZ Bird Sound Classifier</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: #193a30;
      background: #f6f5ef;
      --forest: #194b3a;
      --border: #e4e6dc;
      --muted: #68776e;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: clamp(1.25rem, 5vw, 4rem) 1.25rem;
      background: radial-gradient(ellipse at 82% 4%, #e8eddc 0, transparent 27rem), #f6f5ef;
    }
    main { max-width: 800px; margin: auto; }
    .back {
      display: inline-flex; align-items: center; gap: .5rem; color: var(--forest);
      font-size: .9rem; font-weight: 750; text-decoration: none;
    }
    .back:hover { text-decoration: underline; text-underline-offset: 4px; }
    .card {
      margin-top: 1.4rem; padding: clamp(1.25rem, 5vw, 2.5rem);
      background: #fffefa; border: 1px solid var(--border); border-radius: 24px;
      box-shadow: 0 18px 55px #18351d0c, 0 2px 8px #18351d08;
    }
    .eyebrow { margin: 0 0 .65rem; color: var(--forest); font-size: .72rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 500; letter-spacing: -.05em; }
    .scientific { margin: .4rem 0 1.3rem; color: var(--muted); font-size: 1.05rem; font-style: italic; }
    .description { max-width: 62ch; margin-bottom: 1.6rem; font-size: 1.05rem; line-height: 1.75; }
    .photo { display: block; width: 100%; max-height: 520px; object-fit: cover; border-radius: 17px; }
    .image-status { color: var(--muted); }
    .image-source { display: block; margin-top: .65rem; color: var(--forest); font-size: .85rem; }
    .image-status { padding: 1rem; border-radius: 12px; background: #f3f5ee; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { body { padding: 1.2rem .9rem 2rem; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="{{ url_for('index') }}">← <span>Back to analysis</span></a>
    <article class="card">
      <p class="eyebrow">Bird profile · Aotearoa New Zealand</p>
      <h1>{{ bird.name }}</h1>
      <p class="scientific">{{ bird.scientific_name }}</p>
      <p class="description">{{ bird.description }}</p>
      <img id="bird-photo" class="photo" alt="Photo of {{ bird.name }}" hidden>
      <p id="image-status" class="image-status" role="status" aria-live="polite">
        Loading a photo…
      </p>
      <a id="image-source" class="image-source" hidden target="_blank" rel="noopener noreferrer">
        Photo source: Wikipedia
      </a>
    </article>
  </main>
  <script>
    (() => {
      const photo = document.querySelector("#bird-photo");
      const status = document.querySelector("#image-status");
      const source = document.querySelector("#image-source");
      const title = {{ bird.wikipedia_title|tojson }};
      const endpoint = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;

      fetch(endpoint)
        .then((response) => {
          if (!response.ok) throw new Error("No photo is available right now.");
          return response.json();
        })
        .then((page) => {
          if (!page.thumbnail || !page.thumbnail.source) {
            throw new Error("No photo is available for this bird.");
          }
          photo.src = page.thumbnail.source;
          photo.hidden = false;
          status.hidden = true;
          if (page.content_urls && page.content_urls.desktop) {
            source.href = page.content_urls.desktop.page;
            source.hidden = false;
          }
        })
        .catch(() => {
          status.textContent = "A photo could not be loaded. The bird facts are still available.";
        });
    })();
  </script>
</body>
</html>
